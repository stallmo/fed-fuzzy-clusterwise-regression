# =====================================================================
# For a full TOML configuration guide, check the Flower docs:
# https://flower.ai/docs/framework/how-to-configure-pyproject-toml.html
# =====================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fed-fuzzy-clust-regression"
version = "0.1.0"
description = ""
license = "Apache-2.0"
# Dependencies for your Flower App
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "scikit-learn>=1.6.1",
    "wandb>=0.23.1",
    "optuna>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "morris"

# Point to your ServerApp and ClientApp objects
# Format: "<module>:<object>"
[tool.flwr.app.components]
serverapp = "fed_fuzzy_clust_regression.server_app:app"
clientapp = "fed_fuzzy_clust_regression.client_app:app"

# Custom config values accessible via `context.run_config`
[tool.flwr.app.config]
num-server-rounds = 1
local-epochs = 1 # we solve the ridge regression problem exactly in each round
num-clients = 10
# Configure dataset
dataset-name = "abalone"
dirichlet-alpha = 100.0
# Preprocessing parameters
test-size = 0.2
apply-preprocessing = "False"
clip-lower-q = 0.03 # tuned by optuna
clip-upper-q = 0.97 # tuned by optuna
# Cluster model parameters
num-clusters = 14 # tuned by optuna
fuzzy-m = 2.1177118536403277 # tuned by optuna
clust-tol-local = 1e-3
clust-tol-global = 1e-3
clust-max-iter-local = 100
clust-max-iter-global = 1
# Regression model parameters
ridge-alpha = 6.239000823038692 # tuned by optuna


# Default federation to use when running the app
[tool.flwr.federations]
default = "local-simulation"

# Local simulation federation with 10 virtual SuperNodes
[tool.flwr.federations.local-simulation]
options.num-supernodes = 10


# Remote federation example for use with SuperLink
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true  # Remove this line to enable TLS
# root-certificates = "<PATH/TO/ca.crt>"  # For TLS setup
